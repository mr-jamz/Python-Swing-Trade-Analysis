name: Run swing stock screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check NYSE trading calendar
        id: market_day
        run: python src/market_day.py

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' || steps.market_day.outputs.market_open == 'true'
        run: python -m unittest discover -s tests

      - name: Build report
        if: github.event_name == 'workflow_dispatch' || steps.market_day.outputs.market_open == 'true'
        run: python src/screener.py

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.market_day.outputs.market_open == 'true'
        uses: actions/configure-pages@v5

      - name: Upload report
        if: github.event_name == 'workflow_dispatch' || steps.market_day.outputs.market_open == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Publish report
        if: github.event_name == 'workflow_dispatch' || steps.market_day.outputs.market_open == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

